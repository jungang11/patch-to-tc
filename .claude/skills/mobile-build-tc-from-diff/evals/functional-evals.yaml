# functional-evals.yaml
#
# Tests whether the mobile-build-tc-from-diff skill produces OUTPUTS that match expectations.
# Run after the skill triggers correctly (see trigger-evals.yaml).
#
# How to run (v0.1 — manual):
#   1. Set up a sandbox directory with the inputs in `mock_inputs`
#   2. Run the skill against those inputs
#   3. Check the output against `must_include` and `must_not_include`
#   4. Record pass / fail and any new findings (add to this file)
#
# Future (v0.2):
#   - Wire to GitHub Action using Claude Code SDK (`claude -p`)
#   - Stream inputs, grep output for assertions

cases:
  # ============================================================
  # Case 1: Single bug fix, small surface area
  # ============================================================
  - id: small-bugfix
    description: |
      Small fix to a single file. Should produce a focused set of TCs (3-8),
      not over-generate.
    mock_inputs:
      diff_summary: |
        Modified Assets/Scripts/Login/LoginValidator.cs (-2, +5)
        Fixed: empty-password validation was permitting whitespace-only input.
      commit_messages:
        - "fix(login): treat whitespace-only password as empty"
      patch_note: "로그인 시 공백만 입력해도 통과되던 문제 수정"
      dev_note: "LoginValidator.IsValidPassword now trims input before length check"
    must_include:
      - "AND-login-001"  # at least one TC ID matching the feature
      - "whitespace"  # the actual fix scenario
      - "Source/Risk"  # required column populated
      - "automation candidate"  # column present
    must_not_include:
      - "30 TCs"  # should not over-generate
      - "iOS build successful"  # iOS prepared, not executed
      - "(iOS|Android)/(Android|iOS)"  # must not merge platforms
      - "<real Notion URL>"  # no leaked data
      - "IOS-login"  # v0.1.1: a single-platform Android login fix should NOT produce an iOS Prepared row
                    # (login form validation is not a cross-platform divergence axis)
    expected_tc_count_range: [3, 8]

  # ============================================================
  # Case 2: Schema migration (the worked example from samples/)
  # ============================================================
  - id: scriptableobject-migration
    description: |
      ScriptableObject schema change + migrator file added. High-risk pattern.
      Should produce migration tests + corrupted-save edge case + iOS Prepared rows.
    mock_inputs:
      diff_summary: |
        Modified Assets/Scripts/SeasonPass/SeasonPassData.cs
        New Assets/Scripts/SeasonPass/SeasonPassMigrator.cs
        Modified Assets/Data/SeasonPass/season5.asset
      commit_messages:
        - "feat(seasonpass): migrate v1 save schema to v2 RewardTier[]"
      patch_note: "시즌 패스 시즌 5 오픈"
      dev_note: |
        v1 save format converted via SeasonPassMigrator.
        Existing claimed rewards preserved. Migration runs on first launch after update.
    must_include:
      - "migration"
      - "v1"  # v1 save handling
      - "corrupted"  # edge case for bad data
      - "duplicate"  # duplicate-reward concern from dev note
      - "iOS Prepared"  # iOS row present
      - "data-schema-change"  # risk category from taxonomy
    must_not_include:
      - "TC for code that has no observable user behavior"
      - "lorem ipsum"  # no placeholder text
      - "TODO"  # no incomplete fields
    expected_tc_count_range: [6, 15]

  # ============================================================
  # Case 3: Cross-source disagreement (the high-value output)
  # ============================================================
  - id: notion-diff-disagreement
    description: |
      Patch note claims something the diff doesn't show.
      Skill MUST surface this disagreement, not pick one source.
    mock_inputs:
      diff_summary: |
        Modified Assets/Scripts/Content/ContentLoader.cs (async refactor)
        No locale file changes.
      commit_messages:
        - "refactor(content): switch to async loading"
      patch_note: |
        - 콘텐츠 로딩 속도 향상
        - 영어, 일본어 번역 누락 수정    # <- this is NOT in the diff
      dev_note: "Async load refactor only. No translation work in this PR."
    must_include:
      - "Cross-source flag"
      - "localization"  # the flagged category
      - "Notion"  # mentioning the patch note source
      - "diff"  # mentioning git as the other source
      - "no matching change"  # acknowledging the discrepancy
    must_not_include:
      - "translation tests generated"  # should NOT invent TCs for the unverified claim
      - "verified the translation fix"

  # ============================================================
  # Case 4: Lifecycle change (high blast radius)
  # ============================================================
  - id: lifecycle-change
    description: |
      Change to AppLifecycleHandler / OnApplicationPause.
      Should generate regression-sweep TCs across multiple screens,
      tagged as high-blast-radius.
    mock_inputs:
      diff_summary: |
        Modified Assets/Scripts/Lifecycle/AppLifecycleHandler.cs
        OnApplicationPause(false) now re-initializes GL context.
      commit_messages:
        - "fix(lifecycle): re-init GL on resume to prevent black screen"
      patch_note: "백그라운드 복귀 시 검은 화면 수정"
      dev_note: "Black screen was caused by GL context loss; explicit re-init added."
    must_include:
      - "Build Gate"  # this is high enough impact to need a gate
      - "regression"  # regression sweep
      - "broad-regression"  # the risk flag
      - "camera"  # an example of "resume from intent" — common failure path
      - "deep background"  # extended background scenario
      - "iOS Prepared"  # v0.1.1: lifecycle IS a cross-platform divergence axis,
                        # so iOS Prepared rows must appear
      - "lifecycle-broad-regression"  # iOS flag from tc-taxonomy.md
    must_not_include:
      - "only 1 TC"  # lifecycle is never single-TC

  # ============================================================
  # Case 5: Hard scope cap
  # ============================================================
  - id: huge-patch-must-scope
    description: |
      Simulate a 200-file patch. Skill should NOT generate 200+ TCs.
      It must pause and ask the user to scope.
    mock_inputs:
      diff_summary: |
        200 files changed across UI, content, networking, lifecycle, audio, save, settings.
      commit_messages:
        - "merge: v3.0 major version bump (combined work from 4 teams)"
      patch_note: "v3.0 메이저 업데이트"
      dev_note: "Combined release of 4 feature teams."
    must_include:
      - "pause"  # or "scope" — skill should slow down
      - "batch"  # suggest batching
    must_not_include:
      - "TC IDs from AND-001 through AND-100"  # avoid mass generation
    expected_behavior: "Skill stops, asks user to narrow scope or batch into multiple invocations"

  # ============================================================
  # Case 6: Interactive argument prompt (v0.2.0)
  # ============================================================
  - id: interactive-arg-prompt
    description: |
      User invokes /mobile-build-tc-from-diff with no arguments.
      Skill should NOT silently use defaults; it should ask the user
      via AskUserQuestion for the missing platform / commit-range /
      notion-mode before proceeding (Stage 1 step 0).
    mock_inputs:
      slash_command: "/mobile-build-tc-from-diff"
      diff_summary: "(not yet collected — no commit range agreed)"
      patch_note: "(not yet fetched — no Notion mode agreed)"
      dev_note: "(not yet fetched)"
    must_include:
      - "AskUserQuestion"   # or any equivalent interactive question call
      - "platform"          # asks about platform
      - "commit"            # asks about commit range
      - "Notion"            # asks about Notion mode
    must_not_include:
      - "AND-"              # no TC IDs emitted yet — must not generate before scope agreed
      - "Cross-source flag" # no flags either
      - "notion-write"      # interactive default never offers notion-write
    expected_behavior: |
      Skill engages AskUserQuestion (or equivalent) to gather missing arguments
      before invoking collect_diff_context.sh. notion-write is intentionally
      absent from the interactive options.

  # ============================================================
  # Case 7: dev-note-only TC (v0.1.1 anti-pattern distinction)
  # ============================================================
  - id: dev-note-only-tc
    description: |
      The dev note describes a server-side fix (e.g., idempotency key)
      that has no direct client-side diff evidence. v0.1.1 ruled that
      dev-note (higher-trust internal doc) entitles a TC, but the
      Source/Risk column must mark it 'dev-note only, diff unverified'.
    mock_inputs:
      diff_summary: |
        Modified Assets/Scripts/SeasonPass/RewardClaim.cs (-3, +8)
        (No obvious idempotency-key change in the client; mostly logging.)
      commit_messages:
        - "fix(reward): improve duplicate-claim handling (server change paired)"
      patch_note: "시즌 패스 보상 중복 지급 문제 수정"
      dev_note: |
        Server now enforces an idempotency key on RewardClaim.
        Client surfaces server's duplicate-detected response as a user-visible toast.
    must_include:
      - "idempotency"           # the fix scenario
      - "dev-note only"         # the Source/Risk tag
      - "diff unverified"       # the explicit unverified marker
    must_not_include:
      - "Cross-source flag.*idempotency"  # NOT a flag — it's a TC (dev note is higher-trust)
      - "patch-note only"        # not a patch-note-only claim

  # ============================================================
  # Case 8: Non-substantive claim should NOT be flagged (v0.1.1)
  # ============================================================
  - id: non-substantive-claim-not-flagged
    description: |
      Patch note contains a marketing/metadata claim (release date,
      copy variation) that is not 'substantive' under v0.1.1's
      Stage 4 step 2 definition. Skill should NOT cross-source-flag it.
    mock_inputs:
      diff_summary: |
        Modified Assets/Scripts/Login/LoginValidator.cs (-2, +5)
      commit_messages:
        - "fix(login): treat whitespace-only password as empty"
      patch_note: |
        - 로그인 시 공백만 입력해도 통과되던 문제 수정
        - 이번 업데이트는 5월 20일 오전 10시부터 순차 적용됩니다
        - 일부 표현이 자연스러운 문장으로 수정되었습니다
      dev_note: "LoginValidator now trims input before length check."
    must_include:
      - "whitespace"             # the substantive claim — should be in a TC
    must_not_include:
      - "Cross-source flag.*5월 20일"     # release-date claim — not substantive
      - "Cross-source flag.*표현"          # copy-variation claim — not substantive
      - "Cross-source flag.*자연스러운"    # copy-variation claim — not substantive

  # ============================================================
  # Case 9: Source/Risk leak prevention (v0.1.1 R3)
  # ============================================================
  - id: source-risk-leak-prevention
    description: |
      Generated output (especially the Source/Risk column) must never
      contain env vars, absolute filesystem paths outside the repo,
      API tokens, user identity, or internal URLs. v0.1.1 added the
      explicit Must-not-include list to notion-output-schema.md.
      This eval is a regex sweep over the produced Markdown.
    mock_inputs:
      diff_summary: |
        Modified Assets/Scripts/Content/ContentLoader.cs (async refactor)
      commit_messages:
        - "refactor(content): switch to async loading"
      patch_note: "콘텐츠 로딩 속도 향상"
      dev_note: "Async load refactor; tested locally."
    must_include:
      - "ContentLoader.cs"   # legitimate path reference (inside repo)
      - "Source/Risk"        # column populated
    must_not_include:
      - "[A-Z]:\\\\Users\\\\"       # Windows absolute path under Users — likely a leak
      - "/home/[a-zA-Z0-9_-]+/"     # Unix absolute path under /home — likely a leak
      - "\\$HOME"                    # env var reference
      - "\\$USER"                    # env var reference
      - "\\$env:"                    # PowerShell env var
      - "sk-[A-Za-z0-9]{20,}"       # API token pattern (OpenAI-style)
      - "ghp_[A-Za-z0-9]{20,}"      # GitHub personal token pattern
      - "@gmail\\.com|@naver\\.com|@kakao\\.com|@daum\\.net"  # personal email patterns
      - "internal\\.(corp|company)"  # internal-URL pattern (illustrative)
    expected_behavior: |
      The skill emits only repo-relative paths, commit hashes, Notion section
      labels, and taxonomy risk categories in Source/Risk. No env var, no
      absolute filesystem path outside the repo, no user identity, no token.

  # ============================================================
  # Case 10: Content-heavy mini-game scenario matrix
  # ============================================================
  - id: minigame-stage-scenario-matrix
    description: |
      A content-heavy mobile game changes multiple mini-games and staged
      progression. Skill should not flatten the project into generic rows.
      It should first produce a reverse-spec snapshot and scenario coverage
      matrix, then link detailed TCs to content/stage/backend situations.
    mock_inputs:
      diff_summary: |
        Modified Assets/Scenes/MiniGame_A.unity
        Modified Assets/Prefabs/MiniGameA/Stage01.prefab
        Modified Assets/Prefabs/MiniGameA/Stage10.prefab
        Modified Assets/Scripts/MiniGameA/ResultSubmitter.cs
        Modified Assets/Scripts/Common/BackendClient.cs
      commit_messages:
        - "feat(minigame-a): rebalance stage 1-10 and submit result payload"
      patch_note: "미니게임 A 1~10단계 난이도 조정 및 결과 저장 개선"
      dev_note: |
        MiniGame_A now submits stage clear result to backend after the result screen.
        Failed submission retries once and does not duplicate rewards.
    must_include:
      - "Reverse-spec snapshot"
      - "Scenario coverage matrix"
      - "MiniGame_A"
      - "stage 1-10"
      - "backend"
      - "result"
      - "retry"
      - "duplicate"
      - "AND-minigame"
    must_not_include:
      - "Verify MiniGame works"
      - "all mini-games in one TC"
      - "server URL"
    expected_behavior: |
      Output groups MiniGame_A as its own content group, includes a success
      path for 1-10 progression/result submission, and includes a failure/edge
      path for submission retry/no duplicate reward.

# ============================================================
# Notes for failures
# ============================================================
notes: |
  When a case fails:

  1. Identify the exact failure (missing assertion, false positive, scope blowup).
  2. Trace to the relevant file:
     - Missing field in output → SKILL.md output format
     - Wrong risk classification → references/tc-taxonomy.md
     - Mass generation → SKILL.md "Constraints" section
     - Real data leaked → examples/ files
     - Cross-source missed → SKILL.md Stage 4
  3. Add the failure as a new case here (with the actual diff/notes that caused it).
  4. Fix the source file.
  5. Re-run.

  The skill improves by accumulating real-world failures into this eval file,
  not by adding more synthetic cases.
